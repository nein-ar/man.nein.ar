name: Deploy manpages to Pages

on:
  push:
    branches: ["master"]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mandoc zstd

      - name: Restore render cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: man-render-${{ runner.os }}

      - name: Run manpage generator
        run: go run ./cmd/gendoc config.toml

      - name: Save render cache
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: man-render-${{ runner.os }}

      - name: Copy static assets to pub
        run: cp -r ./site/. ./pub/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./pub"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
